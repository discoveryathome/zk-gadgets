[package]
name = "zk-gadget-pilot"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-relations = "=0.5.1"
ark-r1cs-std = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["crh", "sponge", "r1cs", "merkle_tree"] }
ark-groth16 = "=0.5.0"
ark-snark = "=0.5.1"
ark-std = "=0.5.0"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
